<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Money Shelter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 28px; padding: 36px 24px; max-width: 380px; width: 100%; box-shadow: 0 20px 45px -10px rgba(0,0,0,0.08); }
    .logo-container { width: 96px; height: 96px; margin: 0 auto 20px; border-radius: 24px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); border: 1px solid #f1f5f9; padding: 8px; }
    .logo-img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; color: #0f172a; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; line-height: 1.4; }
    .spinner { width: 36px; height: 36px; border: 3.5px solid #e2e8f0; border-top-color: #0e7490; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 14px; font-weight: 600; color: #0e7490; margin-bottom: 20px; }
    .error-box { display: none; margin-top: 10px; }
    .error-msg { background: #fef2f2; border: 1px solid #fecaca; border-radius: 14px; padding: 12px; font-size: 12px; color: #b91c1c; line-height: 1.4; margin-bottom: 20px; text-align: left; }
    .input-label { font-size: 12px; font-weight: 600; text-align: left; color: #475569; margin-bottom: 6px; display: block; }
    .input-field { width: 100%; padding: 12px 14px; border-radius: 12px; background: #f8fafc; border: 1px solid #cbd5e1; color: #0f172a; font-size: 14px; outline: none; margin-bottom: 16px; }
    .input-field:focus { border-color: #0e7490; background: #fff; }
    .btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, #0e7490 0%, #155e75 100%); color: #fff; box-shadow: 0 4px 15px rgba(14, 116, 144, 0.35); }
    .btn-primary:active { transform: scale(0.98); }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; background: #ecfeff; color: #0e7490; border: 1px solid #a5f3fc; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="logo.png" alt="Money Shelter" class="logo-img" />
    </div>
    <span class="badge">Money Shelter Mobile</span>
    <h1>Connecting...</h1>
    <p class="subtitle" id="subStatus">Opening Money Shelter Financial Portal</p>

    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="statusMsg">Loading portal...</div>

    <div class="error-box" id="errorBox">
      <div class="error-msg">
        <strong>⚠️ Unable to connect to Money Shelter cloud portal.</strong><br/>
        Please check your internet connection and try again.
      </div>

      <label class="input-label" for="serverUrlInput">Portal Address:</label>
      <input type="text" id="serverUrlInput" class="input-field" value="https://money-shelter.vercel.app/login" />

      <button class="btn btn-primary" onclick="connectToServer()">
        🔄 Retry Connection
      </button>
    </div>
  </div>

  <script>
    const CANDIDATES = [
      localStorage.getItem("moneyshelter_server_url"),
      "https://money-shelter.vercel.app/lendbridge/login",
      "https://money-shelter.vercel.app/login"
    ].filter(Boolean);

    let activeUrl = CANDIDATES[0] || "https://money-shelter.vercel.app/lendbridge/login";
    document.getElementById("serverUrlInput").value = activeUrl;

    function setStatus(loading, title, msg, isError = false) {
      document.querySelector("h1").innerText = title;
      document.getElementById("statusMsg").innerText = msg;
      document.getElementById("statusMsg").style.color = isError ? "#b91c1c" : "#0e7490";
      document.getElementById("spinner").style.display = loading ? "block" : "none";
      document.getElementById("errorBox").style.display = isError ? "block" : "none";
    }

    async function probeServer(url) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3500);
      try {
        await fetch(url + "/api/auth/session", {
          signal: controller.signal,
          mode: 'no-cors'
        });
        clearTimeout(timeoutId);
        return true;
      } catch (e) {
        clearTimeout(timeoutId);
        return false;
      }
    }

    async function tryConnectAll() {
      for (const url of CANDIDATES) {
        setStatus(true, "Connecting...", "Connecting to portal...", false);
        const ok = await probeServer(url);
        if (ok) {
          setStatus(false, "Connected!", "Opening Money Shelter...", false);
          localStorage.setItem("moneyshelter_server_url", url);
          setTimeout(() => window.location.replace(url), 200);
          return;
        }
      }
      // If direct fetch is prevented by network or CORS, proceed to primary cloud URL
      setTimeout(() => {
        window.location.replace(activeUrl);
      }, 1000);
    }

    function connectToServer() {
      let val = document.getElementById("serverUrlInput").value.trim();
      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        val = "https://" + val;
      }
      if (val.endsWith("/")) {
        val = val.slice(0, -1);
      }
      document.getElementById("serverUrlInput").value = val;
      localStorage.setItem("moneyshelter_server_url", val);
      window.location.replace(val);
    }

    window.addEventListener("DOMContentLoaded", () => {
      tryConnectAll();
    });
  </script>
</body>
</html>
