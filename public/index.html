<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>QuickFinSure</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b1329; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 32px 24px; max-width: 380px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
    .logo-container { width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 20px; background: linear-gradient(135deg, #059669 0%, #10b981 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35); }
    .logo-icon { font-size: 40px; }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.4; }
    .spinner { width: 36px; height: 36px; border: 3.5px solid rgba(255, 255, 255, 0.15); border-top-color: #34d399; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 14px; font-weight: 500; color: #34d399; margin-bottom: 20px; }
    .error-box { display: none; margin-top: 10px; }
    .error-msg { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; padding: 12px; font-size: 12px; color: #fca5a5; line-height: 1.4; margin-bottom: 20px; text-align: left; }
    .input-label { font-size: 12px; font-weight: 600; text-align: left; color: #94a3b8; margin-bottom: 6px; display: block; }
    .input-field { width: 100%; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; font-size: 14px; outline: none; margin-bottom: 16px; }
    .input-field:focus { border-color: #34d399; }
    .btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { background: transparent; color: #94a3b8; margin-top: 10px; font-size: 13px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(52, 211, 153, 0.15); color: #34d399; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <span class="logo-icon">⚡</span>
    </div>
    <span class="badge">QuickFinSure Mobile</span>
    <h1>Connecting...</h1>
    <p class="subtitle" id="subStatus">Linking with your desktop database in real-time</p>

    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="statusMsg">Checking server connection...</div>

    <div class="error-box" id="errorBox">
      <div class="error-msg">
        <strong>⚠️ Unable to connect to PC server.</strong><br/>
        1. Make sure your phone is connected to the <b>same Wi-Fi</b> as your laptop.<br/>
        2. Verify your PC is on and running the server.
      </div>

      <label class="input-label" for="serverUrlInput">PC Server Address (Wi-Fi):</label>
      <input type="text" id="serverUrlInput" class="input-field" value="http://192.168.1.8:3000" placeholder="http://192.168.1.8:3000" />

      <button class="btn btn-primary" onclick="connectToServer()">
        🔄 Retry Connection
      </button>
      <button class="btn btn-secondary" onclick="tryAlternative()">
        Try Alternative IP (172.30.1.192)
      </button>
    </div>
  </div>

  <script>
    const CANDIDATES = [
      localStorage.getItem("quickfinsure_server_url"),
      "http://192.168.1.8:3000",
      "http://172.30.1.192:3000"
    ].filter(Boolean);

    let activeUrl = CANDIDATES[0] || "http://192.168.1.8:3000";
    document.getElementById("serverUrlInput").value = activeUrl;

    function setStatus(loading, title, msg, isError = false) {
      document.querySelector("h1").innerText = title;
      document.getElementById("statusMsg").innerText = msg;
      document.getElementById("statusMsg").style.color = isError ? "#f87171" : "#34d399";
      document.getElementById("spinner").style.display = loading ? "block" : "none";
      document.getElementById("errorBox").style.display = isError ? "block" : "none";
    }

    async function probeServer(url) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2500);
      try {
        await fetch(url + "/api/auth/session", {
          signal: controller.signal,
          mode: 'no-cors'
        });
        clearTimeout(timeoutId);
        return true;
      } catch (e) {
        clearTimeout(timeoutId);
        return false;
      }
    }

    async function tryConnectAll() {
      for (const url of CANDIDATES) {
        setStatus(true, "Connecting...", "Testing " + url + "...");
        const ok = await probeServer(url);
        if (ok) {
          setStatus(false, "Connected!", "Opening QuickFinSure...", false);
          localStorage.setItem("quickfinsure_server_url", url);
          setTimeout(() => window.location.replace(url), 200);
          return;
        }
      }
      setStatus(false, "Connection Failed", "Could not reach PC server on Wi-Fi", true);
    }

    async function checkAndRedirect(url) {
      setStatus(true, "Connecting...", "Connecting to " + url + "...");
      const ok = await probeServer(url);
      if (ok) {
        setStatus(false, "Connected!", "Opening QuickFinSure...", false);
        localStorage.setItem("quickfinsure_server_url", url);
        setTimeout(() => window.location.replace(url), 200);
      } else {
        setStatus(false, "Connection Failed", "Could not reach " + url, true);
      }
    }

    function connectToServer() {
      let val = document.getElementById("serverUrlInput").value.trim();
      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        val = "http://" + val;
      }
      if (val.endsWith("/")) {
        val = val.slice(0, -1);
      }
      document.getElementById("serverUrlInput").value = val;
      checkAndRedirect(val);
    }

    function tryAlternative() {
      document.getElementById("serverUrlInput").value = "http://172.30.1.192:3000";
      connectToServer();
    }

    window.addEventListener("DOMContentLoaded", () => {
      tryConnectAll();
    });
  </script>
</body>
</html>
